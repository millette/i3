# i3status-rust: copy this whole folder to ~/.config/i3status-rust/
# (config.toml, scripts/). Needs Node >= 26; nothing else from this repo.
#
# Each custom block runs `scripts/<source>.ts --follow`: one JSON line per
# change, {"state": "Good", "text": "...", "short_text": "..."}. `state` picks
# the theme colours below. Clicks run `scripts/<source>.ts <action>`, which
# also tells the running block to update immediately.

[theme]
theme = "native"
[theme.overrides]
idle_fg = "#a6adc8"
info_fg = "#89b4fa"
good_fg = "#a6e3a1"
warning_fg = "#fab387"
critical_fg = "#f38ba8"

[icons]
icons = "none"

# ------------------------------------------------------------- now playing
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/now-playing.ts --follow"
persistent = true
json = true
hide_when_empty = true
[[block.click]]
button = "left"
cmd = "~/.config/i3status-rust/scripts/now-playing.ts toggle"
[[block.click]]
button = "middle"
cmd = "~/.config/i3status-rust/scripts/now-playing.ts previous"
[[block.click]]
button = "right"
cmd = "~/.config/i3status-rust/scripts/now-playing.ts next"
[[block.click]]
button = "up"
cmd = "~/.config/i3status-rust/scripts/now-playing.ts previous"
[[block.click]]
button = "down"
cmd = "~/.config/i3status-rust/scripts/now-playing.ts next"

# ---------------------------------------------------------------- pomodoro
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/pomodoro.ts --follow"
persistent = true
json = true
[[block.click]]
button = "left"
cmd = "~/.config/i3status-rust/scripts/pomodoro.ts toggle"
[[block.click]]
button = "middle"
cmd = "~/.config/i3status-rust/scripts/pomodoro.ts reset"
[[block.click]]
button = "right"
cmd = "~/.config/i3status-rust/scripts/pomodoro.ts skip"

# ---------------------------------------------------------------- workrave
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/workrave.ts --follow"
persistent = true
json = true
[[block.click]]
button = "left"
cmd = "~/.config/i3status-rust/scripts/workrave.ts details"
[[block.click]]
button = "right"
cmd = "~/.config/i3status-rust/scripts/workrave.ts open"

# -------------------------------------------------------------------- time
[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%a %d %b %H:%M') "

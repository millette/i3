; polybar: copy this whole folder to ~/.config/polybar/ (config.ini, launch.sh,
; scripts/). Needs Node >= 26; nothing else from this repo. Start it from i3
; with ./i3.conf.
;
; scripts/*.ts print polybar markup themselves (%{F#..} colours and %{A..}
; click areas that call the same script back), so now playing gets separate
; ⏮ / ⏭ buttons inside one module.

[colors]
background = #1e1e2e
foreground = #cdd6f4
focused = #45475a
urgent = #f38ba8
muted = #a6adc8

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
background = ${colors.background}
foreground = ${colors.foreground}
padding-right = 1
module-margin = 1
separator = │
separator-foreground = ${colors.focused}
font-0 = monospace:size=11;2
font-1 = Noto Color Emoji:scale=10;2
modules-left = i3
modules-center = now-playing
modules-right = pomodoro workrave date tray
enable-ipc = true
cursor-click = pointer
wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
label-focused = %name%
label-focused-background = ${colors.focused}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 1
label-mode = %mode%
label-mode-background = ${colors.urgent}
label-mode-padding = 1

[module/now-playing]
type = custom/script
exec = ~/.config/polybar/scripts/now-playing.ts --follow
tail = true

[module/pomodoro]
type = custom/script
exec = ~/.config/polybar/scripts/pomodoro.ts --follow
tail = true

[module/workrave]
type = custom/script
exec = ~/.config/polybar/scripts/workrave.ts --follow
tail = true

[module/date]
type = internal/date
interval = 10
date = %a %d %b
time = %H:%M
label = %date% %time%

[module/tray]
type = internal/tray
tray-spacing = 4pt

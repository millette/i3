# Own status_command in TypeScript (bin/i3bar-status.ts), run by nub.
# Keeps i3bar (workspaces, tray); this program draws the status area and
# handles clicks directly, no extra processes per block.
#
# Clicks: now playing  left toggle · middle previous · right next · scroll prev/next
#         pomodoro     left start/pause/advance · shift+left or middle reset · right skip
#         workrave     left details (notification) · right open workrave
bar {
    position top
    font pango:monospace 10
    status_command ~/.local/bin/i3bar-status
    colors {
        background #1e1e2e
        statusline #cdd6f4
        separator  #45475a
    }
}

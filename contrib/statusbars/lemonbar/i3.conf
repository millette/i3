# In ~/.config/i3/config: remove (or comment out) the bar {} block, then:
exec_always --no-startup-id sh -c 'pkill -f lemonbar-feed; exec ~/.local/bin/lemonbar-feed'
# Needs lemonbar with Xft (e.g. lemonbar-xft) for emoji and TrueType fonts.
# Pass your own lemonbar flags to override the defaults:
#   exec_always --no-startup-id ~/.local/bin/lemonbar-feed -p -g x28 -f "monospace:size=12" -a 40
